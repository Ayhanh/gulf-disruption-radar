<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Gulf Disruption Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <a href="/" class="inline-flex items-center gap-2 mb-2">
            <span class="text-3xl">✈️</span>
            <span class="text-xl font-bold tracking-tight text-slate-900">Gulf Disruption Radar</span>
        </a>
        <h2 class="text-sm font-medium text-slate-500">Set a New Account Password</h2>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-2xl sm:px-10">
            
            {% if error %}
            <div class="mb-5 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium">
                {{ error }}
            </div>
            {% endif %}

            <form action="/auth/reset-password" method="POST" class="space-y-4">
                <input type="hidden" name="token" value="{{ token }}">

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">New Password</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1">Confirm New Password</label>
                    <input type="password" name="confirm_password" required minlength="6" placeholder="Repeat new password" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm text-sm transition">
                        Update Password & Sign In →
                    </button>
                </div>
            </form>

        </div>

        <div class="mt-6 text-center">
            <a href="/auth?mode=login" class="text-xs text-slate-500 hover:text-slate-800 font-medium">← Back to Sign In</a>
        </div>
    </div>

</body>
</html>
