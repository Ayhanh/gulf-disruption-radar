name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: radar_user
          POSTGRES_PASSWORD: radar_pass
          POSTGRES_DB: radar_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U radar_user -d radar_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          DATABASE_URL: postgresql://radar_user:radar_pass@localhost:5432/radar_db
          RAPIDAPI_KEY: test_key
          TELEGRAM_BOT_TOKEN: test_token
          ADMIN_EMAIL: admin@test.com
          APP_BASE_URL: http://localhost:8000
          SMTP_PASSWORD: ""
          DEBUG: "false"
        run: |
          pytest tests/ -v

      - name: Lint
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
